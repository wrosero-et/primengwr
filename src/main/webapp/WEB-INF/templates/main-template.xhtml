<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<!-- 
    Template Principal de la Aplicación
    
    Este template define la estructura base de todas las páginas:
    - Header con navegación
    - Sidebar con menú
    - Content área principal
    - Footer
    
    Usa PrimeFlex para diseño responsive
-->

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    
    <title><ui:insert name="title">PrimeNG JSF Showcase</ui:insert></title>
    
    <!-- PrimeFlex CSS para diseño responsive -->
    <h:outputStylesheet library="primefaces" name="primeflex/primeflex.min.css"/>
    
    <!-- Estilos personalizados -->
    <h:outputStylesheet library="css" name="custom.css"/>
    
    <!-- Configuración de PrimeFaces -->
    <f:metadata>
        <ui:insert name="metadata"/>
    </f:metadata>
</h:head>

<h:body>
    <!-- Layout Principal con PrimeFlex Grid System -->
    <div class="layout-wrapper">
        
        <!-- Header / Navbar -->
        <header class="layout-topbar p-shadow-2">
            <div class="layout-topbar-content">
                <!-- Logo -->
                <h:link outcome="/index" styleClass="layout-topbar-logo">
                    <i class="pi pi-prime" style="font-size: 2rem; color: #007bff;"/>
                    <span class="ml-2">PrimeNG JSF</span>
                </h:link>
                
                <!-- Botón de menú móvil -->
                <p:button icon="pi pi-bars" styleClass="p-button-text layout-topbar-menu-button lg:hidden"/>
                
                <!-- Menú de navegación -->
                <nav class="layout-topbar-menu">
                    <ul class="flex list-none m-0 p-0">
                        <li>
                            <h:link outcome="/index" styleClass="flex align-items-center px-3 py-2">
                                <i class="pi pi-home mr-2"/>
                                <span>Inicio</span>
                            </h:link>
                        </li>
                        <li>
                            <h:link outcome="/components/form" styleClass="flex align-items-center px-3 py-2">
                                <i class="pi pi-pencil mr-2"/>
                                <span>Formularios</span>
                            </h:link>
                        </li>
                        <li>
                            <h:link outcome="/components/datatable" styleClass="flex align-items-center px-3 py-2">
                                <i class="pi pi-table mr-2"/>
                                <span>Tablas</span>
                            </h:link>
                        </li>
                        <li>
                            <h:link outcome="/components/charts" styleClass="flex align-items-center px-3 py-2">
                                <i class="pi pi-chart-bar mr-2"/>
                                <span>Gráficos</span>
                            </h:link>
                        </li>
                    </ul>
                </nav>
            </div>
        </header>
        
        <!-- Contenedor Principal con Sidebar y Content -->
        <div class="layout-main-container">
            
            <!-- Sidebar -->
            <aside class="layout-sidebar">
                <div class="layout-sidebar-content">
                    <h3 class="px-3 py-2">Componentes</h3>
                    
                    <!-- Menú de componentes -->
                    <p:panelMenu styleClass="w-full">
                        <p:submenu label="Formularios" icon="pi pi-pencil">
                            <p:menuitem value="Inputs Básicos" outcome="/components/form" icon="pi pi-fw pi-pencil"/>
                            <p:menuitem value="Validaciones" outcome="/components/validation" icon="pi pi-fw pi-check-circle"/>
                            <p:menuitem value="File Upload" outcome="/components/upload" icon="pi pi-fw pi-upload"/>
                        </p:submenu>
                        
                        <p:submenu label="Datos" icon="pi pi-table">
                            <p:menuitem value="DataTable" outcome="/components/datatable" icon="pi pi-fw pi-table"/>
                            <p:menuitem value="DataView" outcome="/components/dataview" icon="pi pi-fw pi-th-large"/>
                        </p:submenu>
                        
                        <p:submenu label="Paneles" icon="pi pi-window-maximize">
                            <p:menuitem value="Panel" outcome="/components/panel" icon="pi pi-fw pi-clone"/>
                            <p:menuitem value="Accordion" outcome="/components/accordion" icon="pi pi-fw pi-bars"/>
                            <p:menuitem value="TabView" outcome="/components/tabview" icon="pi pi-fw pi-folder"/>
                        </p:submenu>
                        
                        <p:submenu label="Gráficos" icon="pi pi-chart-bar">
                            <p:menuitem value="Charts" outcome="/components/charts" icon="pi pi-fw pi-chart-line"/>
                        </p:submenu>
                        
                        <p:submenu label="Mensajes" icon="pi pi-bell">
                            <p:menuitem value="Messages" outcome="/components/messages" icon="pi pi-fw pi-info-circle"/>
                            <p:menuitem value="Growl" outcome="/components/growl" icon="pi pi-fw pi-bell"/>
                        </p:submenu>
                    </p:panelMenu>
                </div>
            </aside>
            
            <!-- Content Area -->
            <main class="layout-main">
                <div class="layout-main-content">
                    <!-- Breadcrumb -->
                    <div class="mb-3">
                        <ui:insert name="breadcrumb">
                            <p:breadCrumb styleClass="w-full"/>
                        </ui:insert>
                    </div>
                    
                    <!-- Mensajes globales -->
                    <p:messages id="messages" showDetail="true" closable="true"/>
                    
                    <!-- Contenido de la página -->
                    <div class="card">
                        <ui:insert name="content">
                            <p>Contenido por defecto</p>
                        </ui:insert>
                    </div>
                </div>
            </main>
        </div>
        
        <!-- Footer -->
        <footer class="layout-footer">
            <div class="layout-footer-content">
                <span>© 2024 PrimeNG JSF Showcase - Desarrollado con </span>
                <a href="https://www.primefaces.org/" target="_blank" class="text-primary">PrimeFaces</a>
                <span> y </span>
                <a href="https://www.primefaces.org/primeflex/" target="_blank" class="text-primary">PrimeFlex</a>
            </div>
        </footer>
    </div>
</h:body>
</html>
